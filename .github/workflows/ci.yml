name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    # Macget targets macOS 26.4 (Tahoe). `macos-latest` currently resolves to
    # Sequoia, which can compile against the macOS 26 SDK but cannot run the
    # test host. Pin to `macos-26` so the test bundle can actually launch.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Build (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project Macget.xcodeproj \
            -scheme Macget \
            -configuration Debug \
            -destination 'platform=macOS' \
            build

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Macget.xcodeproj \
            -scheme Macget \
            -destination 'platform=macOS' \
            -only-testing:MacgetTests \
            -resultBundlePath tests.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests.xcresult
          retention-days: 7
