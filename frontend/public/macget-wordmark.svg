<svg viewBox="0 0 1100 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MacGet wordmark">
  <defs>
    <linearGradient id="wmBg" x1="160" y1="0" x2="160" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5AC8FA"/>
      <stop offset="0.5" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0033B0"/>
    </linearGradient>
    <radialGradient id="wmGloss" cx="160" cy="-30" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wmWhite" x1="160" y1="70" x2="160" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8E8FF"/>
    </linearGradient>
    <clipPath id="wmClip"><rect x="20" y="20" width="280" height="280" rx="64"/></clipPath>
  </defs>

  <!-- Mini icon at left -->
  <g clip-path="url(#wmClip)">
    <rect x="20" y="20" width="280" height="280" fill="url(#wmBg)"/>
    <rect x="20" y="20" width="280" height="280" fill="url(#wmGloss)"/>
    <g transform="translate(20 20) scale(0.273)">
      <rect x="320" y="280" width="96" height="340" rx="48" fill="url(#wmWhite)"/>
      <rect x="464" y="230" width="96" height="390" rx="48" fill="url(#wmWhite)"/>
      <rect x="608" y="310" width="96" height="310" rx="48" fill="url(#wmWhite)"/>
      <path d="M 220 570 L 804 570 L 540 848 Q 512 876 484 848 Z" fill="url(#wmWhite)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="340" y="195" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="150" font-weight="700" letter-spacing="-4" fill="#0A2A66">MacGet</text>
  <text x="343" y="245" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="500" letter-spacing="2" fill="#0A84FF">MULTI-THREADED · OPEN SOURCE</text>
</svg>
