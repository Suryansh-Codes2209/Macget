<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Macget Capture</title>
  <style>
    body { font: 13px -apple-system, system-ui, sans-serif; width: 320px; margin: 0; padding: 16px; color: #1d1d1f; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    .row { margin-bottom: 14px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    textarea { width: 100%; height: 70px; box-sizing: border-box; font-family: ui-monospace, monospace; }
    input[type="number"] { width: 90px; }
    .hint { color: #6e6e73; font-size: 11px; margin-top: 2px; }
    .saved { color: #1a7f37; font-size: 11px; height: 14px; }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #f0f0f0; }
      .hint { color: #a0a0a0; }
    }
  </style>
</head>
<body>
  <h1>Macget Download Capture</h1>
  <div class="row">
    <label><input type="checkbox" id="enabled" /> Capture downloads</label>
    <div class="hint">Also turn on “Auto-capture” in Macget → Settings → Browser integration.</div>
  </div>
  <div class="row">
    <label for="minSize">Skip files smaller than (MB)</label>
    <input type="number" id="minSize" min="0" step="1" />
    <div class="hint">0 captures everything.</div>
  </div>
  <div class="row">
    <label for="denylist">Never capture these domains</label>
    <textarea id="denylist" placeholder="one domain per line, e.g.&#10;mail.google.com&#10;internal.example.com"></textarea>
  </div>
  <div class="saved" id="saved"></div>
  <script src="options.js"></script>
</body>
</html>
