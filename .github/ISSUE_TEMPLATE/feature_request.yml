name: 💡 Feature request
description: Suggest an idea or improvement for MacGet
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please describe the problem before the solution — it helps me weigh it against the rest of the roadmap.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this isn't already requested
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The pain point or use case, not the feature itself.
      placeholder: When I queue 50 files I can't tell which are stalled because…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like MacGet to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or how other tools do it.
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to work on a PR for this
